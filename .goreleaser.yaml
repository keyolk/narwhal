version: 2

project_name: narwhal

builds:
  - main: ./cmd/narwhal
    binary: narwhal
    ldflags:
      # Same stamp the Makefile sets, so a released binary reports its tag
      # to the broker exactly as a local `make install` would.
      - -s -w -X main.version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # cc-mods' installer looks for <name>_<version>_<os>_<arch>.tar.gz with the
  # binary at the archive root; keep this name stable.
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
